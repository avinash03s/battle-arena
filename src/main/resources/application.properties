server.port=${PORT:8080}
spring.application.name=BATTLE-ARENA

spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/
logging.level.root=INFO
logging.level.com.battlearena=DEBUG


spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} : %m%n